[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-visualizer"
version = "0.1.0"
description = "Stage 1 CLI prototype for dependency graph visualization"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dependency-visualizer = "dependency_visualizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
